x-app-volumes: &app-volumes
  - .:/app
  - staticstore:/static
  - mediastore:/media
  - filesstore:/arquivos
  - certstore:/certificados

volumes:
  certstore:
  filesstore:
  mediastore:
  pgdata:
  staticstore:

services:
  bd:
    image: postgres:17
    environment:
      POSTGRES_DB: emensageria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emensageria"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/web-entrypoint.sh"]
    depends_on:
      bd:
        condition: service_healthy
    environment: *app-env
    ports:
      - "8000:8000"
    volumes: *app-volumes

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/cron-entrypoint.sh"]
    depends_on:
      bd:
        condition: service_healthy
    environment: *app-env
    volumes: *app-volumes
